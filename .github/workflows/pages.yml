name: Publication (GitHub Pages)

# Publie l'application sur GitHub Pages avec le modèle fourni (ADR 0004).
# Le modèle est téléchargé au build depuis Hugging Face, vérifié par ses sommes SHA-256
# (scripts/bundled-model/camembert-ner.json) puis servi par le site lui-même : à l'exécution,
# l'application ne contacte que sa propre origine (R1).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      # configure-pages consulte les métadonnées du site, sans le modifier.
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Cache du modèle fourni
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: models/Xenova/camembert-ner
          key: bundled-model-${{ hashFiles('scripts/bundled-model/camembert-ner.json') }}
      - name: Téléchargement et vérification du modèle fourni
        run: |
          if [ ! -f models/Xenova/camembert-ner/onnx/model_quantized.onnx ]; then
            node scripts/fetch-bundled-model.ts models/Xenova/camembert-ner
          fi

      - name: Tests de bout en bout (dont le modèle fourni)
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Build avec le modèle fourni
        run: npm run build
        env:
          LESSIVE_BUNDLED_MODEL: models/Xenova/camembert-ner
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
